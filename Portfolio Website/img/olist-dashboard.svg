<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
  <title id="title">Olist analytics dashboard preview</title>
  <desc id="desc">Illustrative dashboard artwork with verified project summary figures; the bar shapes are decorative, not source measurements.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#19271e"/><stop offset="1" stop-color="#0e1511"/></linearGradient>
    <linearGradient id="bars" x1="0" y1="1" x2="0" y2="0"><stop stop-color="#5e8c3e"/><stop offset="1" stop-color="#caff75"/></linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#fff" stroke-opacity=".055"/></pattern>
  </defs>
  <rect width="1000" height="600" fill="url(#bg)"/><rect width="1000" height="600" fill="url(#grid)"/>
  <text x="64" y="67" fill="#caff75" font-family="monospace" font-size="16" letter-spacing="2">OLIST / E-COMMERCE ANALYTICS</text>
  <text x="64" y="110" fill="#f2f6ef" font-family="Arial,sans-serif" font-size="28" font-weight="700">Marketplace performance overview</text>
  <text x="64" y="140" fill="#a6b2a6" font-family="monospace" font-size="12">HISTORICAL DATA · 2016—2018</text>
  <g transform="translate(64 176)">
    <rect width="262" height="102" rx="7" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".12"/>
    <text x="20" y="31" fill="#a6b2a6" font-family="monospace" font-size="11">TOTAL REVENUE</text><text x="20" y="74" fill="#f4f7ef" font-family="Arial,sans-serif" font-size="30" font-weight="700">R$ 13.59M</text>
  </g>
  <g transform="translate(348 176)">
    <rect width="262" height="102" rx="7" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".12"/>
    <text x="20" y="31" fill="#a6b2a6" font-family="monospace" font-size="11">ORDERS ANALYSED</text><text x="20" y="74" fill="#f4f7ef" font-family="Arial,sans-serif" font-size="30" font-weight="700">99,441</text>
  </g>
  <g transform="translate(632 176)">
    <rect width="304" height="102" rx="7" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".12"/>
    <text x="20" y="31" fill="#a6b2a6" font-family="monospace" font-size="11">REPEAT CUSTOMER RATE</text><text x="20" y="74" fill="#caff75" font-family="Arial,sans-serif" font-size="30" font-weight="700">~3.1%</text>
  </g>
  <g transform="translate(64 310)">
    <rect width="872" height="226" rx="7" fill="#fff" fill-opacity=".045" stroke="#fff" stroke-opacity=".1"/>
    <text x="22" y="32" fill="#e8eee5" font-family="Arial,sans-serif" font-size="15" font-weight="700">Dashboard visual preview</text>
    <text x="22" y="53" fill="#91a092" font-family="monospace" font-size="10">ILLUSTRATIVE CHART SHAPES · NOT SOURCE MEASUREMENTS</text>
    <path d="M26 183H845M26 145H845M26 107H845M26 69H845" stroke="#fff" stroke-opacity=".08"/>
    <g fill="url(#bars)"><rect x="44" y="157" width="42" height="26" rx="3"/><rect x="108" y="144" width="42" height="39" rx="3"/><rect x="172" y="150" width="42" height="33" rx="3"/><rect x="236" y="122" width="42" height="61" rx="3"/><rect x="300" y="130" width="42" height="53" rx="3"/><rect x="364" y="102" width="42" height="81" rx="3"/><rect x="428" y="114" width="42" height="69" rx="3"/><rect x="492" y="76" width="42" height="107" rx="3"/><rect x="556" y="91" width="42" height="92" rx="3"/><rect x="620" y="61" width="42" height="122" rx="3"/><rect x="684" y="83" width="42" height="100" rx="3"/><rect x="748" y="96" width="42" height="87" rx="3"/></g>
    <g fill="#91a092" font-family="monospace" font-size="9"><text x="44" y="205">JAN</text><text x="236" y="205">APR</text><text x="428" y="205">JUL</text><text x="620" y="205">OCT</text><text x="770" y="205">DEC</text></g>
  </g>
</svg>
